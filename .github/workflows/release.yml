name: Auto Bump & Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'

jobs:
  # ── Job 1: Auto-bump patch version on push to master ──────────────
  bump:
    # Skip bot commits (version bumps) to prevent infinite loop.
    # Also skip if this was triggered by a tag push.
    if: >-
      github.ref_type != 'tag' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Commit and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git tag ${{ steps.bump.outputs.tag }}
          git push origin master --tags

  # ── Job 2: Build and publish the release ──────────────────────────
  release:
    # Run after bump (push to master) OR directly on manual tag push.
    needs: [bump]
    if: always() && (needs.bump.result == 'success' || github.ref_type == 'tag')
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    # macOS build is allowed to fail without blocking the Windows build, which is
    # the primary target for Hou.la shops. ⚠️ Such a failure is SILENT for Mac
    # users: the release goes out without latest-mac.yml and every Mac stays on
    # the previous version (v1.0.27, 2026-09-13). Check the macOS job after each
    # release. (The old "no Apple certificate" note is obsolete since 2026-07-03:
    # a Developer ID certificate valid until 2031-07-04 is in MAC_CSC_LINK.)
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      # Do not cancel the Windows build if the macOS build fails.
      fail-fast: false
      matrix:
        # Pin Windows to 2022: node-gyp 9.x cannot detect the Visual Studio
        # install on the newer windows-latest (Server 2025) image, breaking the
        # native-module rebuild (@serialport/bindings-cpp, better-sqlite3).
        os: [windows-2022, macos-latest]
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/tags/${{ needs.bump.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pin Python 3.11 so node-gyp can compile native modules
      # (@serialport/bindings-cpp). Python 3.12+ removed `distutils`,
      # which node-gyp's bundled gyp still imports, breaking the macOS build.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      # Compile main + preload (tsc) and copy the renderer into dist/ so that
      # electron-builder finds the app entry (dist/main/index.js). Without this,
      # packaging fails the sanity check on a missing entry file.
      - name: Build app
        run: npm run build

      # macOS notarization uses the App Store Connect API key (works with the
      # Admin-role key; only Developer ID cert *creation* needs the Account
      # Holder). Write the .p8 to a file the notarizer can read (macOS only).
      - name: Write ASC API key for notarization
        if: matrix.os == 'macos-latest'
        env:
          ASC_KEY: ${{ secrets.MAC_ASC_API_KEY_P8 }}
        run: printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc_api_key.p8"
        shell: bash

      # macOS signing keychain, built by US and handed to electron-builder via
      # CSC_KEYCHAIN. electron-builder's own path (CSC_LINK) passes the .p12
      # password to `security set-key-partition-list` instead of the keychain
      # password; macOS 26.6 images reject it ("SecKeychainUnlock: The user name
      # or passphrase you entered is not correct"), which killed the v1.0.27 mac
      # build on 2026-09-13 with a VALID certificate. Details in the script.
      # If the mac secrets are ever removed, the build falls back to unsigned.
      - name: Prepare macOS signing keychain
        if: matrix.os == 'macos-latest'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: bash scripts/ci/prepare-mac-signing.sh

      - name: Publish release (Windows)
        if: matrix.os != 'macos-latest'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''

      # Signing identity comes from CSC_KEYCHAIN (previous step); notarization
      # from the App Store Connect API key (APPLE_API_KEY / _KEY_ID / _ISSUER).
      # ⚠️ Do NOT add CSC_LINK here, not even empty: electron-builder only checks
      # `== null`, so '' sends it down its buggy keychain path again, where it
      # resolves '' as a file path ("<project dir> not a file").
      - name: Publish release (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarization can take 1–2h during Apple backlogs; without this,
          # electron-builder refuses to attach the late .dmg to a release that was
          # "published more than 2 hours ago" (the Windows job publishes first).
          EP_GH_IGNORE_TIME: true
          APPLE_API_KEY: ${{ format('{0}/asc_api_key.p8', runner.temp) }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_ASC_API_ISSUER }}
          APPLE_TEAM_ID: QD77PQAUU5

      - name: Remove macOS signing keychain
        if: always() && matrix.os == 'macos-latest'
        run: security delete-keychain "$RUNNER_TEMP/houla-signing.keychain-db" 2>/dev/null || true
